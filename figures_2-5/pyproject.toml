authors = ["Garth Ilsley"]
version = "0.1.0"
classifiers = ["Private :: Do Not Upload"]
license = "MIT OR Apache-2.0"
description = "Code and notebooks to generate figures 2-5 of the associated manuscript"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "formulaic>=1.1.1",
