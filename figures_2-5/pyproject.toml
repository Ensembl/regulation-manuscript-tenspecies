    "pandas>=2.3.0",
    "pygenometracks~=3.9",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.7.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "upsetplot>=0.9.0",
]
